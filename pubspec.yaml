name: cave_player
description: Общая музыкальная библиотека для своих — музыка играет прямо с Google Дисков.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  http: ^1.2.2
  # Вход через Google на Android (на Windows не используется)
  audio_service: ">=0.18.15 <0.19.0"
  audio_session: ">=0.1.21 <0.2.0" # 0.2.x требует Kotlin 2 в Gradle; так сборка идёт на Flutter 3.27
  google_sign_in: ">=7.1.1 <8.0.0"
  xml: ^6.5.0
  crypto: ^3.0.5
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  desktop_drop: ">=0.4.4 <1.0.0"
  file_selector: ^1.0.3
  ffi: ^2.1.0
  archive: ^3.6.1
  # Сжатие картинок (аватарки, баннеры, обложки) и уменьшенные копии для кэша
  # Версии до 4.3 работают вместе с archive 3.x, на которой написано обновление программы
  image: ">=4.1.0 <4.3.0"
  window_manager: ^0.4.3
  tray_manager: ^0.2.3
  # Своя копия плагина: возвращает кнопки миниатюры после того, как окно спрятали и показали
  windows_taskbar:
    path: packages/windows_taskbar

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/logo.png
    - assets/taskbar/prev.ico
    - assets/taskbar/play.ico
    - assets/taskbar/pause.ico
    - assets/taskbar/next.ico
