name: Android

# Сборка APK для телефона. Подпись — всегда одним и тем же ключом из секретов,
# поэтому SHA-1 для Google Sign-In не меняется от сборки к сборке,
# а новая версия ставится поверх старой без удаления.
on:
  workflow_dispatch:
  push:
    branches:
      - android/**
      - feature/android-mvp

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Версия Flutter та же, что в сборке Windows, чтобы зависимости решались одинаково
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Подготовить проект Android
        run: bash tool/setup_android.sh

      - name: Проверка кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/mobile_main.dart lib/mobile

      - name: Тесты
        run: flutter test test/cover_cache_test.dart test/fullscreen_cover_test.dart test/offline_settings_test.dart

      - name: Проверить секреты
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$GOOGLE_WEB_CLIENT_ID" ] && missing="$missing GOOGLE_WEB_CLIENT_ID"
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing (Settings → Secrets and variables → Actions). Без постоянного ключа подписи SHA-1 будет меняться."
            exit 1
          fi

      - name: Ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cavey-release.jks"
          {
            echo "CAVEY_KEYSTORE=$RUNNER_TEMP/cavey-release.jks"
            echo "CAVEY_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CAVEY_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "CAVEY_KEY_ALIAS=${ANDROID_KEY_ALIAS:-cavey}"
          } >> "$GITHUB_ENV"

      - name: Собрать подписанный APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BUILD_CHANNEL: ${{ github.ref_name }}
        run: |
          flutter build apk --release --target lib/mobile_main.dart \
            --build-name "$APP_VERSION" --build-number "${{ github.run_number }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=BUILD_CHANNEL="$BUILD_CHANNEL"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/CaveyPlayer.apk

      - name: Подпись APK (SHA-1 для Google Cloud)
        run: |
          TOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$TOOL" verify --print-certs dist/CaveyPlayer.apk | tee certs.txt
          SHA1=$(grep -m1 "SHA-1 digest" certs.txt | awk '{print $NF}')
          echo "::notice title=SHA-1 подписи::$SHA1 (пакет app.cavey.cave_player)"
          echo "### SHA-1 подписи: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Пакет: \`app.cavey.cave_player\`. Он должен совпадать с Android OAuth-клиентом в Google Cloud." >> "$GITHUB_STEP_SUMMARY"
          if grep -qi "Android Debug" certs.txt; then
            echo "::error::APK подписан отладочным ключом"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CaveyPlayer-${{ env.APP_VERSION }}
          path: dist/CaveyPlayer.apk
          if-no-files-found: error
          retention-days: 14

      # Пререлиз android-v<версия>: Windows-плеер смотрит только теги v*, test-* и beta-*, так что их не заденет.
      # Приложение на телефоне ищет именно android-v* и ставит самую новую.
      - name: Опубликовать в релизы
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Секрет RELEASES_TOKEN не задан, APK только в артефактах сборки"
            exit 0
          fi
          repo=Creative-Cave-uefn/cave-player-releases
          notes="${NOTES:-Cavey Player для Android $APP_VERSION}"
          gh release create "android-v$APP_VERSION" dist/CaveyPlayer.apk \
            --repo "$repo" --prerelease \
            --title "Android $APP_VERSION" --notes "$notes"
          # Оставляем три последние сборки
          gh release list --repo "$repo" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^android-v[0-9.]+$' | sort -V | head -n -3 \
            | while read -r tag; do gh release delete "$tag" --repo "$repo" --cleanup-tag --yes || true; done
          echo "::notice::Android $APP_VERSION опубликован"
