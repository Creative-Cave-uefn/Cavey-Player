name: Cavey DevKit validation

on:
  push:
    branches:
      - devkit
      - feat/keivi-devkit-20261117
    paths:
      - tools/**
      - lib/core/**
      - lib/main.dart
      - test/test_build_admin_test.dart
      - test/smoke_test_test.dart
      - test/github_cache_test.dart
      - test/problem_report_test.dart
      - lib/ui/accounts_view.dart
      - .github/workflows/devkit-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-devkit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DevKit dependencies (exact lockfile)
        shell: pwsh
        run: npm ci --prefix tools/devkit --no-audit --no-fund
      - name: TypeScript typecheck
        shell: pwsh
        run: npm run typecheck --prefix tools/devkit
      - name: React UI and parser tests
        shell: pwsh
        run: npm test --prefix tools/devkit
      - name: Windows PowerShell 5.1 syntax and engine tests
        shell: powershell
        run: .\tools\test-cavey-devkit.ps1 -SkipNpm

  ui-screens:
    # Drives the real terminal UI in a pseudo-terminal with PowerShell and gh
    # replaced by test doubles; screens are uploaded for review.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci --prefix tools/devkit --no-audit --no-fund
          pip install pyte==0.8.2
      - name: Terminal UI screen tests (sources)
        run: python3 tools/devkit/test/ui/ui_snapshots.py --out ui-screens
      - name: Terminal UI screen tests (bundle the launcher runs)
        run: |
          npm run build --prefix tools/devkit
          python3 tools/devkit/test/ui/ui_snapshots.py --bundle --out ui-screens-bundle
      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devkit-ui-screens
          path: |
            ui-screens
            ui-screens-bundle

  player-cleanup-rules:
    # The player's "delete old test builds" must follow the same retention as DevKit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Analyze and test the player code DevKit depends on
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/core lib/main.dart lib/ui/accounts_view.dart
          flutter test test/test_build_admin_test.dart test/smoke_test_test.dart test/github_cache_test.dart test/problem_report_test.dart
