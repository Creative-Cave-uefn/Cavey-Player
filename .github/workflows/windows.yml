name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Папку windows/ генерирует сам Flutter; если вы уже закоммитили свою, она останется как есть
      - name: Подготовить проект Windows
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name polka --org app.polka .
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          Copy-Item assets/app_icon.ico windows/runner/resources/app_icon.ico -Force
          $main = 'windows/runner/main.cpp'
          (Get-Content $main) `
            -replace 'L"polka"', 'L"Polka"' `
            -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1240, 800)' |
            Set-Content $main

      - run: flutter pub get

      # Ошибки дублируются аннотациями, чтобы их было видно на странице сборки без открытия логов
      - name: Проверка кода
        shell: pwsh
        run: |
          $out = flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Out-String
          Write-Output $out
          $errs = @($out -split "`n" | Where-Object { $_ -match '^\s*error - ' } | ForEach-Object { $_.Trim() })
          for ($i = 0; $i -lt $errs.Count -and $i -lt 30; $i++) {
            $kind = @('error', 'warning', 'notice')[[math]::Floor($i / 10)]
            Write-Output "::${kind}::$($errs[$i])"
          }
          if ($errs.Count -gt 0) { exit 1 }

      - name: Тесты
        shell: pwsh
        run: |
          $out = flutter test --reporter expanded 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = @($out -split "`n" | Where-Object { $_ -match 'Error|Expected|Actual|\[E\]|failed' } | Select-Object -First 30)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $kind = @('error', 'warning', 'notice')[[math]::Floor($i / 10)]
              Write-Output "::${kind}::$($lines[$i].Trim())"
            }
            exit $code
          }

      - name: Сборка
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          flutter build windows --release `
            "--dart-define=GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID" `
            "--dart-define=GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET"

      - name: Установщик и портативная версия
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Polka-portable.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer/polka.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Polka-Windows
          path: dist/*
