name: Сборка для Windows

on:
  # main — обычные обновления для всех; beta — бета-версии для тех, кто включил
  # «Получать бета-версии»; остальные ветки — тестовые сборки, которые можно выбрать
  # в плеере: Настройки → Обновления → Тестовые сборки
  push:
    branches: ['**']
  workflow_dispatch:
  # Ветку удалили — убираем её тестовую сборку
  delete:

# Новый пуш в ту же ветку отменяет недоделанную тестовую сборку; сборки main доводятся до конца
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Validate before compilation and release. Publishing directly from the Windows
  # build runner avoids the GitHub Actions artifact storage quota.
  checks:
    if: github.event_name != 'delete'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Версия Flutter закреплена: в свежих версиях движок под Windows вылетает
      # (access violation в flutter_windows.dll, см. историю коммитов)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      # Папку windows/ генерирует сам Flutter; если вы уже закоммитили свою, она останется как есть
      - name: Подготовить проект Windows
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name cave_player --org app.caveplayer .
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          Copy-Item assets/app_icon.ico windows/runner/resources/app_icon.ico -Force
          $main = 'windows/runner/main.cpp'
          (Get-Content $main) `
            -replace 'L"cave_player"', 'L"Cavey"' `
            -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1240, 800)' |
            Set-Content $main

      - run: flutter pub get

      # Ошибки дублируются аннотациями, чтобы их было видно на странице сборки без открытия логов
      - name: Проверка кода
        shell: pwsh
        run: |
          $out = flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Out-String
          Write-Output $out
          $errs = @($out -split "`n" | Where-Object { $_ -match '^\s*error - ' } | ForEach-Object { $_.Trim() })
          for ($i = 0; $i -lt $errs.Count -and $i -lt 30; $i++) {
            $kind = @('error', 'warning', 'notice')[[math]::Floor($i / 10)]
            Write-Output "::${kind}::$($errs[$i])"
          }
          if ($errs.Count -gt 0) { exit 1 }

      - name: Проверить публичный API Better Lyrics
        shell: pwsh
        run: |
          @'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'better-lyrics-probe.json'
          try:
              request = urllib.request.Request('https://api.betterlyrics.org/getLyrics?s=E85&a=Don%20Toliver&al=OCTANE&d=154', headers={'User-Agent': 'CavePlayer', 'Accept': 'application/json'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.load(response)
                  ttml = data.get('ttml', '')
                  if isinstance(ttml, str) and ttml.strip():
                      path.write_text(json.dumps(data), encoding='utf-8')
                      print('Better Lyrics live probe: HTTP 200, TTML characters=' + str(len(ttml)))
                  else:
                      print('::warning::Better Lyrics live probe: HTTP 200 without TTML')
          except urllib.error.HTTPError as error:
              print('::warning::Better Lyrics live probe: HTTP ' + str(error.code))
          except Exception as error:
              print('::warning::Better Lyrics live probe: ' + type(error).__name__)
          '@ | python -
          "BETTER_LYRICS_LIVE_JSON=$env:RUNNER_TEMP/better-lyrics-probe.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Тесты
        shell: pwsh
        env:
          CAVE_SOCKSEEK_SMOKE: '1'
        run: |
          $out = flutter test --reporter expanded 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = @($out -split "`n" | Where-Object { $_ -match 'Error|Expected|Actual|\[E\]|failed' } | Select-Object -First 30)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $kind = @('error', 'warning', 'notice')[[math]::Floor($i / 10)]
              Write-Output "::${kind}::$($lines[$i].Trim())"
            }
            exit $code
          }

  build:
    if: github.event_name != 'delete'
    needs: checks
    permissions:
      contents: write
    # Publish verified installers directly to Releases without Actions artifacts.
    # Flutter 3.27 знает только Visual Studio 2022, она есть на образе windows-2022
    runs-on: windows-2022
    env:
      # Номер версии растёт с каждой сборкой: по нему приложение понимает, что вышло обновление
      APP_VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Версия Flutter закреплена: в свежих версиях движок под Windows вылетает
      # (access violation в flutter_windows.dll, см. историю коммитов)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      # Папку windows/ генерирует сам Flutter; если вы уже закоммитили свою, она останется как есть
      - name: Подготовить проект Windows
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name cave_player --org app.caveplayer .
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          Copy-Item assets/app_icon.ico windows/runner/resources/app_icon.ico -Force
          $main = 'windows/runner/main.cpp'
          (Get-Content $main) `
            -replace 'L"cave_player"', 'L"Cavey"' `
            -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1240, 800)' |
            Set-Content $main

      - run: flutter pub get

      # Experimental incremental MSVC build cache, rotated on each successful run.
      - name: Восстановить кэш нативной сборки
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/x64/CMakeFiles
            build/windows/x64/runner/CMakeFiles
            build/windows/x64/plugins
          key: cave-windows-native-v1-${{ runner.os }}-flutter3274-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'windows/**') }}-${{ github.run_id }}
          restore-keys: |
            cave-windows-native-v1-${{ runner.os }}-flutter3274-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'windows/**') }}-

      # Канал сборки: пусто для main, имя ветки для тестовых. Плеер по нему понимает,
      # за какой веткой следить при автообновлении
      - name: Канал сборки
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          $ref = "${{ github.ref }}"
          # Бета не вшивает канал: получать её или нет, решает галочка в настройках
          $beta = if ($ref -eq 'refs/heads/beta') { 'true' } else { 'false' }
          "BUILD_BETA=$beta" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($ref -eq 'refs/heads/main' -or $ref -eq 'refs/heads/beta') {
            "BUILD_CHANNEL=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "BUILD_SLUG=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $slug = ($env:BRANCH.ToLower() -replace '[^a-z0-9]+', '-').Trim('-')
            if (-not $slug) { $slug = 'branch' }
            "BUILD_CHANNEL=$env:BRANCH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "BUILD_SLUG=$slug" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Сборка
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          $out = flutter build windows --release `
            --build-name $env:APP_VERSION --build-number ${{ github.run_number }} `
            "--dart-define=APP_VERSION=$env:APP_VERSION" `
            "--dart-define=BUILD_CHANNEL=$env:BUILD_CHANNEL" `
            "--dart-define=BUILD_BETA=$env:BUILD_BETA" `
            "--dart-define=CAVE_LIBRARY_ID=${{ vars.CAVE_LIBRARY_ID }}" `
            "--dart-define=DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}" `
            "--dart-define=SHARE_URL=${{ vars.SHARE_URL }}" `
            "--dart-define=GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID" `
            "--dart-define=GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET" `
            2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = @($out -split "`n" | Where-Object { $_ -match 'Error|error|requires|version solving|Because ' } | Select-Object -First 30)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $kind = @('error', 'warning', 'notice')[[math]::Floor($i / 10)]
              Write-Output "::${kind}::$($lines[$i].Trim())"
            }
            exit $code
          }

      - name: Сохранить кэш нативной сборки
        uses: actions/cache/save@v4
        with:
          path: |
            build/windows/x64/CMakeFiles
            build/windows/x64/runner/CMakeFiles
            build/windows/x64/plugins
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      # The downloader is a separate private project. Only the CI runner receives
      # its read token; no GitHub/Deezer/Soulseek secrets enter the Flutter build.
      - name: Проверить доступ к отдельному модулю
        shell: pwsh
        env:
          MODULE_READ_TOKEN: ${{ secrets.DOWNLOADER_READ_TOKEN }}
        run: |
          if (-not $env:MODULE_READ_TOKEN) {
            Write-Output "::error::Добавьте Actions Secret DOWNLOADER_READ_TOKEN (read-only доступ к Cavey-Downloader). Без модуля скачивание не работает."
            exit 1
          }

      - name: Получить исходники Cavey-Downloader
        uses: actions/checkout@v5
        with:
          repository: Creative-Cave-uefn/Cavey-Downloader
          ref: ${{ github.ref_name == 'perf/reliability-batch-20261102' && 'perf/reliability-batch-20261102' || github.ref_name == 'feat/unified-links-youtube-reliability' && 'feat/unified-links-youtube-reliability' || 'main' }}
          token: ${{ secrets.DOWNLOADER_READ_TOKEN }}
          path: .cave-downloader-module
          persist-credentials: false

      # The module's private release contains its SHA-256 and exact source
      # commit; it is readable with the existing repo contents token.
      # Never mix unrelated Downloader versions into the player.
      - name: Использовать готовый Downloader из релиза того же коммита
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADER_READ_TOKEN }}
        run: |
          $repo = 'Creative-Cave-uefn/Cavey-Downloader'
          $source = '.cave-downloader-module'
          $sha = (git -C $source rev-parse HEAD).Trim()
          $releasesJson = gh api "repos/$repo/releases?per_page=20" 2>$null | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::notice::Список релизов Downloader недоступен, компилирую локально.'
            exit 0
          }
          foreach ($release in @($releasesJson | ConvertFrom-Json)) {
            if ($release.target_commitish -ne $sha -or $release.draft) { continue }
            $target = Join-Path $source 'prebuilt'
            New-Item -ItemType Directory -Force $target | Out-Null
            gh release download $release.tag_name --repo $repo --pattern 'cave-downloader-windows-x64.exe*' --dir $target 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            $exe = Join-Path $target 'cave-downloader-windows-x64.exe'
            $sum = "$exe.sha256"
            if (-not (Test-Path $exe) -or -not (Test-Path $sum)) { continue }
            $expected = ((Get-Content $sum -Raw).Trim() -split '\s+')[0].ToLower()
            $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              Write-Output '::warning::Контрольная сумма Downloader не совпала, компилирую локально.'
              continue
            }
            Copy-Item $exe build/windows/x64/runner/Release/ -Force
            "CAVE_DOWNLOADER_PREBUILT=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Output "Downloader: использован релиз $($release.tag_name) для commit $sha"
            break
          }

      - name: Собрать независимый Cavey-Downloader.exe
        if: env.CAVE_DOWNLOADER_PREBUILT != 'true'
        shell: pwsh
        env:
          CAVE_DEEZER_ARL_DEFAULT: ${{ secrets.CAVE_DEEZER_ARL }}
          CAVE_SOULSEEK_USERNAME_DEFAULT: ${{ secrets.CAVE_SOULSEEK_USERNAME }}
          CAVE_SOULSEEK_PASSWORD_DEFAULT: ${{ secrets.CAVE_SOULSEEK_PASSWORD }}
        run: |
          Push-Location .cave-downloader-module
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dart compile exe bin/cave_downloader.dart -o cave-downloader-windows-x64.exe `
              "--define=APP_VERSION=3.0.${{ github.run_number }}" `
              "--define=CAVE_DEEZER_ARL_DEFAULT=$env:CAVE_DEEZER_ARL_DEFAULT" `
              "--define=CAVE_SOULSEEK_USERNAME_DEFAULT=$env:CAVE_SOULSEEK_USERNAME_DEFAULT" `
              "--define=CAVE_SOULSEEK_PASSWORD_DEFAULT=$env:CAVE_SOULSEEK_PASSWORD_DEFAULT"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item cave-downloader-windows-x64.exe ../build/windows/x64/runner/Release/ -Force
          } finally { Pop-Location }

      - name: Установщик и портативная версия
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # Keep the same ZIP structure, but use faster compression when available.
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $candidate = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (Test-Path $candidate) { $sevenZip = $candidate }
          }
          if ($sevenZip) {
            $zip = Join-Path (Resolve-Path .).Path 'dist/CavePlayer-portable.zip'
            Push-Location build/windows/x64/runner/Release
            try {
              & $sevenZip a -tzip -mx=1 $zip '*' | Out-Host
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          } else {
            Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/CavePlayer-portable.zip
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyVersion=$env:APP_VERSION" installer/cave_player.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('CavePlayer-Setup.exe', 'CavePlayer-portable.zip')) {
            $file = Join-Path 'dist' $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -le 0) {
              Write-Output "::error::Не создан корректный артефакт: $name"
              exit 1
            }
          }


      # Что изменилось с прошлой версии: заголовки коммитов без слияний. Приложение показывает это под «Проверить обновления»
      - name: Список изменений
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 --match "v*" HEAD^ 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $prev) { "$prev..HEAD" } else { "HEAD~20..HEAD" }
          $subjects = @(git log --no-merges --format="%s" $range | Where-Object { $_ -and $_ -notmatch '^(Merge|Слияние)' } | Select-Object -Unique -First 40)
          $text = ($subjects | ForEach-Object { "• $_" }) -join "`n"
          if (-not $text) { $text = "Cavey $env:APP_VERSION" }
          "RELEASE_NOTES<<EOF_NOTES`n$text`nEOF_NOTES" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Релиз в этом же репозитории: токен не нужен. Приложения видят его, если репозиторий публичный
      - name: Опубликовать релиз здесь
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ env.RELEASE_NOTES || github.event.head_commit.message }}
        run: |
          $notes = if ($env:NOTES) { $env:NOTES } else { "Cavey $env:APP_VERSION" }
          gh release create "v$env:APP_VERSION" dist/CavePlayer-Setup.exe dist/CavePlayer-portable.zip `
            --repo ${{ github.repository }} --target ${{ github.sha }} `
            --title "Cavey $env:APP_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Не получилось создать релиз в этом репозитории" }

      # Обновление для приложений друзей: релиз в публичном репозитории cave-player-releases
      - name: Опубликовать обновление
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ env.RELEASE_NOTES || github.event.head_commit.message }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Output "::notice::Секрет RELEASES_TOKEN не задан, обновление не опубликовано"
            exit 0
          }
          # В пустом репозитории релиз не создать: сначала кладём README первым коммитом
          $check = gh api "repos/Creative-Cave-uefn/cave-player-releases/commits?per_page=1" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::notice::Проверка коммитов: $($check.Trim() -replace "`r?`n", ' ')"
            $text = "# Cavey`n`nУстановщики Cavey. Последняя версия — в разделе Releases, приложение обновляется само.`n"
            $readme = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
            $init = gh api -X PUT repos/Creative-Cave-uefn/cave-player-releases/contents/README.md `
              -f message="Первый коммит" -f content=$readme 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::Первый коммит не создан: $($init.Trim() -replace "`r?`n", ' ')" }
          }
          $notes = if ($env:NOTES) { $env:NOTES } else { "Cavey $env:APP_VERSION" }
          $out = gh release create "v$env:APP_VERSION" dist/CavePlayer-Setup.exe dist/CavePlayer-portable.zip `
            --repo Creative-Cave-uefn/cave-player-releases `
            --title "Cavey $env:APP_VERSION" --notes $notes 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Релиз не опубликован: $($out.Trim() -replace "`r?`n", ' ')"
            exit 1
          }

      # Тестовая сборка ветки: пререлиз в cave-player-releases. Обычные пользователи его не получают
      # (автообновление смотрит только на последний обычный релиз), выбрать его можно в настройках плеера.
      - name: Опубликовать тестовую сборку
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' && startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Output "::notice::Секрет RELEASES_TOKEN не задан, тестовая сборка не опубликована"
            exit 0
          }
          $repo = 'Creative-Cave-uefn/cave-player-releases'
          $prefix = "test-$env:BUILD_SLUG-v"
          # Старые сборки этой ветки больше не нужны: оставляем только свежую
          $old = @(gh release list --repo $repo --limit 200 --json tagName --jq '.[].tagName' 2>$null) |
            Where-Object { $_ -and $_.StartsWith($prefix) }
          foreach ($tag in $old) { gh release delete $tag --repo $repo --cleanup-tag --yes | Out-Null }
          $notes = if ($env:NOTES) { $env:NOTES } else { "Тестовая сборка ветки $env:BUILD_CHANNEL" }
          $out = gh release create "$prefix$env:APP_VERSION" dist/CavePlayer-Setup.exe dist/CavePlayer-portable.zip `
            --repo $repo --prerelease `
            --title "Тест: $env:BUILD_CHANNEL · $env:APP_VERSION" --notes $notes 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Тестовая сборка не опубликована: $($out.Trim() -replace "`r?`n", ' ')"
            exit 1
          }
          Write-Output "::notice::Тестовая сборка $env:APP_VERSION ветки $env:BUILD_CHANNEL опубликована"

      # Бета: пререлиз beta-v<версия>. Его получают те, у кого включено «Получать бета-версии»
      - name: Опубликовать бету
        if: github.ref == 'refs/heads/beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Output "::notice::Секрет RELEASES_TOKEN не задан, бета не опубликована"
            exit 0
          }
          $repo = 'Creative-Cave-uefn/cave-player-releases'
          $notes = if ($env:NOTES) { $env:NOTES } else { "Бета Cavey $env:APP_VERSION" }
          $out = gh release create "beta-v$env:APP_VERSION" dist/CavePlayer-Setup.exe dist/CavePlayer-portable.zip `
            --repo $repo --prerelease `
            --title "Бета · $env:APP_VERSION" --notes $notes 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Бета не опубликована: $($out.Trim() -replace "`r?`n", ' ')"
            exit 1
          }
          # Храним пять последних бет, старые убираем
          $betas = @(gh release list --repo $repo --limit 200 --json tagName --jq '.[].tagName' 2>$null) |
            Where-Object { $_ -match '^beta-v\d' } |
            Sort-Object { [version]($_ -replace '^beta-v', '') } -Descending
          foreach ($tag in ($betas | Select-Object -Skip 5)) { gh release delete $tag --repo $repo --cleanup-tag --yes | Out-Null }
          Write-Output "::notice::Бета $env:APP_VERSION опубликована"

  # Ветку удалили (например, после слияния в main) — её тестовая сборка больше не нужна
  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Удалить тестовую сборку ветки
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          BRANCH: ${{ github.event.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::Секрет RELEASES_TOKEN не задан"; exit 0; fi
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          [ -z "$slug" ] && slug=branch
          gh release list --repo Creative-Cave-uefn/cave-player-releases --limit 200 --json tagName \
            --jq ".[].tagName | select(startswith(\"test-$slug-v\"))" |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo Creative-Cave-uefn/cave-player-releases --cleanup-tag --yes
          done

